<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Face</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white">

                        Upload Student Face

                    </div>

                    <div class="card-body">

                        <form method="POST"
                              enctype="multipart/form-data">

                            <div class="mb-3">

                                <label class="form-label">

                                    Student Username

                                </label>

                                <input type="text"
                                       name="username"
                                       class="form-control"
                                       required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Upload Image

                                </label>

                                <input type="file"
                                       name="image"
                                       class="form-control"
                                       accept="image/*"
                                       required>

                            </div>

                            <button type="submit"
                                    class="btn btn-success w-100">

                                Upload Face

                            </button>

                        </form>

                        <p class="text-success mt-3">

                            {{ message }}

                        </p>

                        <a href="/">

                            Back to Dashboard

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
